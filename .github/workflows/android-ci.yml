name: Phantom X build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper (if missing)
        run: gradle wrapper --gradle-version 8.10.2 || true

      - name: Assemble debug APK
        env:
          PHANTOM_EMAIL: ${{ secrets.PHANTOM_EMAIL }}
          PHANTOM_PASSWORD: ${{ secrets.PHANTOM_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleDebug -PwithWarp=true --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phantomx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
